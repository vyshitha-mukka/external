apiVersion: apps/v1
kind: Deployment
metadata:
  name: myfirst1-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: myfirst1
  template:
    metadata:
      labels:
        app: myfirst1
    spec:
      containers:
        - name: myfirst1
          image: vyshitha/exam1:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
