apiVersion: apps/v1
kind: Deployment
metadata:
  name: myfirst-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: myfirst
  template:
    metadata:
      labels:
        app: myfirst
    spec:
      containers:
        - name: myfirst
          image: vyshitha/exam:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001